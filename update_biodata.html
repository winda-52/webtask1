<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form Update Biodata Mahasiswa">
    <title>Update Biodata - Sistem Informasi Pendataan Mahasiswa</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <header class="site-header">
        <div class="brand">
            <img src="assets/logoundiksha.png" alt="Logo Undiksha" class="logo">

            <div>
                <h1>Selamat Datang</h1>
                <p>Sistem Informasi Pendataan Mahasiswa</p>
            </div>
        </div>

        <nav class="top-nav">
            <a href="#logout">Logout</a>
        </nav>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <h2>Menu</h2>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="biodata.html">Biodata</a></li>
                    <li><a href="update_biodata.html" class="active">Update Biodata</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content">

            <h2 class="content-title">Update Biodata</h2>

            <div class="content-body">

                <form class="biodata-form" action="#" method="post">

                    <div class="form-row">
                        <label for="nama">Nama</label>
                        <span class="colon">:</span>
                        <input type="text"
                               id="nama"
                               name="nama"
                               value="Windarti Setianingrum"
                               placeholder="Tuliskan Nama Anda">
                    </div>

                    <div class="form-row">
                        <label for="nim">NIM</label>
                        <span class="colon">:</span>
                        <input type="text"
                               id="nim"
                               name="nim"
                               value="2415101052"
                               placeholder="Tuliskan NIM Anda">
                    </div>

                    <div class="form-row">
                        <label for="prodi">Program Studi</label>
                        <span class="colon">:</span>
                        <input type="text"
                               id="prodi"
                               name="prodi"
                               value="Ilmu Komputer"
                               placeholder="Tuliskan Program Studi Anda">
                    </div>

                    <div class="form-row">
                        <label for="password">Password</label>
                        <span class="colon">:</span>
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Tuliskan Password Anda">
                    </div>

                    <div class="form-row">
                        <label>Jenis Kelamin</label>
                        <span class="colon">:</span>

                        <div class="options">
                            <label>
                                <input type="radio"
                                       name="kelamin"
                                       value="laki-laki">
                                Laki - Laki
                            </label>

                            <label>
                                <input type="radio"
                                       name="kelamin"
                                       value="perempuan"
                                       checked>
                                Perempuan
                            </label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Hobi</label>
                        <span class="colon">:</span>

                        <div class="options">
                            <label>
                                <input type="checkbox"
                                       name="hobi[]"
                                       value="memasak"
                                       checked>
                                Memasak
                            </label>

                            <label>
                                <input type="checkbox"
                                       name="hobi[]"
                                       value="membaca">
                                Membaca Buku
                            </label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="asalkota">Asal Kota</label>
                        <span class="colon">:</span>

                        <select id="asalkota" name="asalkota">
                            <option value="singaraja" selected>Singaraja</option>
                            <option value="denpasar">Denpasar</option>
                            <option value="surabaya">Surabaya</option>
                            <option value="jakarta">Jakarta</option>
                            <option value="semarang">Semarang</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="komentar">Biografi</label>
                        <span class="colon">:</span>

                        <textarea id="komentar"
                                  name="komentar"
                                  placeholder="Tuliskan biografi Anda">Saya adalah Windarti Setianingrum, mahasiswa Program Studi Ilmu Komputer. Saya berasal dari Singaraja dan memiliki hobi memasak.</textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit">Simpan</button>
                    </div>

                </form>

            </div>
        </main>
    </div>

    <footer class="site-footer">
        <p>Copyright &copy; Winda</p>
    </footer>

</body>
</html>
